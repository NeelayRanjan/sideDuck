name: Portable build and mock desktop
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Native desktop and software Vulkan libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 libxkbcommon-dev libxkbcommon-x11-0 libxcb-shape0-dev libxcb-xfixes0-dev libegl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: CPU references, deterministic input and mock platform
        run: xvfb-run -a cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: Launch the editor against the Linux mock platform
        run: xvfb-run -a ./target/release/sideduck-app --smoke-test
