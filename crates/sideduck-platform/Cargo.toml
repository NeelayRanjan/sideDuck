[package]
name = "sideduck-platform"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
libc = "=0.2.177"
objc2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSEvent", "NSApplication", "NSResponder", "NSView", "NSWindow"] }

