[package]
name = "sideduck-platform"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
libc = "=0.2.177"
objc2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSEvent", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSScreen", "NSColor", "NSGraphics", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSValue", "NSError", "NSGeometry", "NSEnumerator"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString", "CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "libc", "CGDirectDisplay", "CGDisplayConfiguration", "CGWindow", "CGImage", "CGColorSpace", "CGContext", "CGBitmapContext", "CGDataProvider", "CGPDFDocument", "CGPDFPage", "CGAffineTransform", "CGGeometry", "CGError"] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "SCShareableContent", "SCStream", "SCScreenshotManager"] }

