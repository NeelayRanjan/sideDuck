[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
wgpu = "=24.0.5"
pollster = "=0.4.0"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
png = "=0.17.16"
bytemuck = { version = "=1.25.2", features = ["derive"] }
half = { version = "=2.7.1", features = ["bytemuck", "serde"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland"] }

